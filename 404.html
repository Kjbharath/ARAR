<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Page Not Found — ARAR Group</title>
  <link rel="canonical" href="https://arargroup.com/">
  <link rel="icon" href="/ARAR.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .wrap { max-width: 560px; padding: 48px 24px; }
    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      margin-bottom: 32px;
      opacity: 0.9;
    }
    .logo span { color: #D22630; }
    .code {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #D22630, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 12px; }
    p { color: #888; font-size: 0.95rem; line-height: 1.6; margin-bottom: 32px; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #D22630; color: #fff; }
    .btn-outline { border: 1px solid rgba(255,255,255,0.15); color: #ccc; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">ARAR <span>GROUP</span></div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.<br>
    Use the links below to get back on track.</p>
    <div class="btns">
      <a href="/" class="btn btn-primary">Back to Homepage</a>
      <a href="/utility/" class="btn btn-outline">ARAR Utility Co.</a>
    </div>
  </div>
</body>
</html>
