<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting… — ARAR Group</title>
  <script>
    // Dead URL redirect map — handles all old CMS/WordPress paths
    (function () {
      var path = window.location.pathname.replace(/\/+$/, '').toLowerCase();

      var redirectMap = {
        // Old WordPress author pages
        '/author/admin': '/',
        '/author':       '/',

        // Old CMS pages
        '/clients':      '/',
        '/quality':      '/',
        '/about':        '/',
        '/about-us':     '/',
        '/contact':      '/',
        '/contact-us':   '/',
        '/home':         '/',
        '/portfolio':    '/',
        '/projects':     '/',

        // Old service/project pages → utility
        '/services':     '/utility/',
        '/mbr-city':     '/utility/',
        '/supply-install-test-and-commission-of-all-kinds-of-hv-mv-lv-and-foc-cables-upto-132-kv-cable-erection-work': '/utility/',

        // Old demo/lighting pages
        '/demo':                          '/utility/',
        '/demo/lighting-public-lighting': '/utility/',

        // Careers variants
        '/career':       '/careers/',
        '/jobs':         '/careers/',
        '/vacancies':    '/careers/',
        '/join-us':      '/careers/',
        '/join':         '/careers/',
        '/hiring':       '/careers/',
        '/work-with-us': '/careers/',
      };

      // Exact match
      if (redirectMap[path]) {
        window.location.replace(redirectMap[path]);
        return;
      }

      // Prefix match (e.g. /author/anything, /demo/anything, /category/*, /tag/*, /page/*)
      var prefixes = [
        { prefix: '/author/',    dest: '/' },
        { prefix: '/demo/',      dest: '/utility/' },
        { prefix: '/category/',  dest: '/' },
        { prefix: '/tag/',       dest: '/' },
        { prefix: '/page/',      dest: '/' },
        { prefix: '/wp-',        dest: '/' },
        { prefix: '/feed',       dest: '/' },
      ];

      for (var i = 0; i < prefixes.length; i++) {
        if (window.location.pathname.toLowerCase().indexOf(prefixes[i].prefix) === 0) {
          window.location.replace(prefixes[i].dest);
          return;
        }
      }
    })();
  </script>
